name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # lets the job publish the "Latest test build" release

jobs:
  engine-test:
    name: Engine tests (patches + MIDI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the engine test
        working-directory: tools
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -I../app/src/main/cpp render_test.cpp -o render_test
          ./render_test bergz_presets.wav
          g++ -O2 -std=c++17 -Wall -I../app/src/main/cpp midi_test.cpp -o midi_test
          ./midi_test
      - uses: actions/upload-artifact@v4
        with:
          name: preset-demo-wav
          path: tools/bergz_presets.wav

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bergz-zx700-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish as "Latest test build" (download on the phone from Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bergz-zx700-test.apk
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build bergz-zx700-test.apk \
            --prerelease \
            --title "Latest test build" \
            --notes "Automatic build from ${GITHUB_SHA::7}. Open this page on the Pixel 9, download the APK and install it."
